# Builds the web version of Den Duel on every push and runs the tests.
# Publishing to Netlify (which updates the home-screen app on the iPhone)
# costs Netlify credits, so it only happens when asked for: "Run workflow"
# on the Actions tab, or "Re-run all jobs" on any run. Publishing needs the
# NETLIFY_AUTH_TOKEN repository secret (see README, "Play on your iPhone");
# every run's build can also be downloaded from its "Artifacts".
name: Web version

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A newer push replaces a build still running, but never a publish.
    concurrency:
      group: web-version-${{ (github.event_name == 'workflow_dispatch' || github.run_attempt != '1') && 'publish' || 'build' }}
      cancel-in-progress: true
    env:
      GODOT_VERSION: "4.7.2"
      # Publish when started by hand: Run workflow, or a re-run of a push.
      PUBLISH: ${{ github.event_name == 'workflow_dispatch' || github.run_attempt != '1' }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      # The Netlify project to publish to (its Project ID). Not a secret.
      NETLIFY_SITE_ID: ec65fb06-1a53-4651-890b-e011fac4b66f
    steps:
      - uses: actions/checkout@v4

      - name: Reuse Godot from earlier runs
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot

      - name: Test and build
        run: GODOT=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 tools/build_web.sh build/web

      - name: Keep the build as a download
        uses: actions/upload-artifact@v4
        with:
          name: den-duel-web
          path: build/web
          retention-days: 14

      - name: Publish to Netlify
        if: env.PUBLISH == 'true' && env.NETLIFY_AUTH_TOKEN != ''
        run: |
          cd build/web && zip -qr ../site.zip .
          status=$(curl -sS -o ../deploy.json -w "%{http_code}" \
            -H "Content-Type: application/zip" \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            --data-binary "@../site.zip" \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys")
          if [ "$status" -ge 400 ]; then
            # Show Netlify's reason (e.g. a used-up plan or a revoked token).
            echo "::error::Netlify refused the deploy ($status): $(head -c 500 ../deploy.json)"
            exit 1
          fi
          python3 -c "import json; d = json.load(open('../deploy.json')); print('Published', d.get('ssl_url') or d.get('url'), '(' + str(d.get('state')) + ')')"

      - name: Say how to publish
        if: env.PUBLISH != 'true' && env.NETLIFY_AUTH_TOKEN != ''
        run: echo "::notice::Built and tested, not published. To update the site, click Re-run all jobs on this run (or Run workflow on the Web version page)."

      - name: Remind about Netlify setup
        if: env.NETLIFY_AUTH_TOKEN == ''
        run: echo "::notice::Built and tested, but not published. Add the NETLIFY_AUTH_TOKEN secret to publish (see README)."
