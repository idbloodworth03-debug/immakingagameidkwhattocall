/slow_loris/*, art/units/chinese_giant_salamander/*, art/units/bigfoot/*, art/units/black_tortoise/*, art/units/fenrir/*, art/units/nemean_lion/*, art/units/manticore/*, art/units/chupacabra/*, art/units/loch_ness_monster/*, art/units/mongolian_death_worm/*, art/units/hydra/*, art/units/basilisk/*, art/units/sphinx/*, art/units/baku/*"
export_path="../builds/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell=""
html/head_include="<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">
<meta name=\"mobile-web-app-capable\" content=\"yes\">
<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black\">
<meta name=\"apple-mobile-web-app-title\" content=\"Den Duel\">
<meta name=\"theme-color\" content=\"#7ccbf5\">
<style>body { background-color: #7ccbf5; }</style>
<script>if ('serviceWorker' in navigator) { const hadWorker = !!navigator.serviceWorker.controller; let reloaded = false; navigator.serviceWorker.addEventListener('controllerchange', function () { if (hadWorker && !reloaded) { reloaded = true; window.location.reload(); } }); }</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=true
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=2
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0.08627451, 0.22745098, 0.4509804, 1)
