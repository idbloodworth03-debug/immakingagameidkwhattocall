# Builds the web version of Den Duel on every push, runs the tests, and
# publishes it with GitHub Pages (free for public repositories), so the
# home-screen app on the iPhone updates by itself. GitHub Pages has to be
# switched on once (see README, "Play on your iPhone"); until then the build
# still runs and can be downloaded from the run's "Artifacts".
name: Web version

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A newer push replaces a build that's still running.
    concurrency:
      group: web-build-${{ github.ref }}
      cancel-in-progress: true
    env:
      GODOT_VERSION: "4.7.2"
    steps:
      - uses: actions/checkout@v4

      - name: Reuse Godot from earlier runs
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot

      - name: Test and build
        env:
          # Shown in the game's corner with the commit, to check a phone has
          # the newest build.
          BUILD_NUMBER: ${{ github.run_number }}
        run: GODOT=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 tools/build_web.sh build/web

      - name: Keep the build as a download
        uses: actions/upload-artifact@v4
        with:
          name: den-duel-web
          path: build/web
          retention-days: 14

      - name: Package the build for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  publish:
    needs: build
    runs-on: ubuntu-latest
    # One publish at a time, and never cut one off halfway.
    concurrency:
      group: web-publish
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Say where it is
        run: |
          echo "::notice::Published to ${{ steps.deployment.outputs.page_url }}"
          echo "Published to ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Explain a failed publish
        if: failure()
        run: echo "::error::Couldn't publish. Switch GitHub Pages on once in the repository's Settings > Pages > Source > GitHub Actions (see README, Play on your iPhone)."
